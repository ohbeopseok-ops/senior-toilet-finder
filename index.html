<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="시니어를 위한 큰 글씨·음성 중심 안심화장실 길안내 프로토타입" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="안심화장실" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>안심화장실 - 시니어 무장애 길안내</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{safeYellow:'#FFD600',safeYellowHover:'#E5C000',bgDark:'#121212',cardDark:'#1E1E1E',borderDark:'#333333',safeGreen:'#00E676',safeRed:'#FF3B30'}}}}
  </script>
  <style>
    body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .text-scale-large{font-size:1.18rem!important}
    @keyframes pulse-yellow{0%,100%{box-shadow:0 0 0 0 rgba(255,214,0,.75)}50%{box-shadow:0 0 0 22px rgba(255,214,0,0)}}
    .animate-urgent{animation:pulse-yellow 2s infinite}
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative select-none antialiased">
  <header class="bg-[#1a1a1a] border-b-2 border-borderDark px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-3xl" aria-hidden="true">🚾</span>
      <div>
        <h1 class="text-xl font-bold">안심화장실 <span class="bg-safeYellow text-black text-xs font-black px-1.5 py-0.5 rounded">시니어 친화</span></h1>
        <p class="text-xs text-gray-300 font-semibold" id="current-location-text">📍 GPS 위치 확인 중...</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button id="btn-tts-toggle" onclick="toggleVoice()" class="p-2.5 rounded-xl border-2 border-safeYellow bg-black text-safeYellow font-bold" aria-label="음성안내 켜기 또는 끄기"><span id="tts-icon">🔊</span></button>
      <button id="btn-font-toggle" onclick="toggleFontSize()" class="p-2.5 rounded-xl border-2 border-gray-600 bg-black text-white font-bold text-xs" aria-label="글자크기 확대">가+</button>
    </div>
  </header>

  <div class="bg-amber-300 text-black px-4 py-2 text-center text-xs font-black">
    🧪 프로토타입입니다. 현재 화장실 정보·개방 여부·경로는 실시간 공공데이터가 아닙니다.
  </div>

  <main class="flex-1 p-4">
    <section id="view-home" class="flex flex-col gap-4">
      <div class="bg-cardDark border-2 border-borderDark rounded-2xl p-4 text-center">
        <p class="text-gray-200 font-bold text-lg">걸으시는 중에 화장실이 급하신가요?</p>
        <p class="text-safeYellow font-black mt-1">계단 없는 곳을 우선해서 빠르게 보여드립니다</p>
      </div>

      <button onclick="startEmergencySearch()" class="w-full py-8 px-4 rounded-3xl bg-safeYellow text-black font-black flex flex-col items-center gap-2 shadow-2xl animate-urgent active:scale-95">
        <span class="text-5xl">⚡</span>
        <span class="text-3xl">가장 가까운 화장실 찾기</span>
        <span class="text-xs bg-black text-white px-4 py-1.5 rounded-full">한 번 누르면 안내 시작</span>
      </button>

      <div>
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-bold">🔍 주변 안심 화장실 예시</h2>
          <span id="gps-status-indicator" class="text-xs text-gray-400 font-bold">○ 위치 확인 중</span>
        </div>
        <div id="quick-toilet-list" class="space-y-3"></div>
      </div>
    </section>

    <section id="view-navigation" class="hidden flex flex-col gap-4">
      <div class="bg-cardDark border-2 border-safeYellow rounded-2xl p-4">
        <div class="flex justify-between"><span class="bg-safeGreen text-black text-xs font-black px-2.5 py-1 rounded-md">🟢 예시 이용 가능</span><span id="nav-hours" class="text-xs text-gray-300 font-bold"></span></div>
        <h2 id="nav-target-name" class="text-2xl font-black mt-2"></h2>
        <div id="nav-target-tags" class="flex flex-wrap gap-1.5 mt-2"></div>
      </div>

      <div class="bg-[#181818] border-2 border-borderDark rounded-3xl p-5 text-center">
        <div id="compass-arrow" class="w-32 h-32 mx-auto flex items-center justify-center transition-transform">
          <svg class="w-28 h-28 text-safeYellow" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        </div>
        <div id="nav-distance-text" class="text-5xl font-black text-safeYellow mt-3"></div>
        <p id="nav-time-text" class="text-lg font-bold text-gray-200 mt-1"></p>
        <div class="mt-4 bg-black border-2 border-gray-700 rounded-xl p-3"><p id="nav-guidance-instruction" class="text-lg font-bold"></p></div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="simulateWalkStep()" class="py-4 bg-[#2a2a2a] border-2 border-gray-600 rounded-2xl font-bold">👟 모의 이동</button>
        <a id="nav-call-link" href="#" class="py-4 bg-red-950 border-2 border-safeRed rounded-2xl font-bold text-center">📞 관리처 전화</a>
      </div>
      <button onclick="stopNavigation()" class="w-full py-4 bg-black border-2 border-gray-600 text-gray-300 font-bold text-lg rounded-2xl">안내 종료</button>
    </section>
  </main>

  <footer class="bg-[#141414] border-t border-borderDark px-4 py-3 text-center text-xs text-gray-400">
    Senior Toilet Finder · Prototype V0.1
  </footer>

<script>
const restroomList=[
 {id:1,name:"은혜공원 남녀분리 공중화장실",shortName:"은혜공원 화장실",lat:37.3942,lng:126.9568,distance:120,openHours:"24시간 개방(예시)",isOpen:true,stairs:false,ramp:true,handrail:true,emergencyBell:true,tel:"031-8045-2882"},
 {id:2,name:"안양천 산책로 2호 쉼터 화장실",shortName:"안양천 쉼터 화장실",lat:37.3955,lng:126.9585,distance:280,openHours:"06:00~22:00(예시)",isOpen:true,stairs:false,ramp:true,handrail:true,emergencyBell:true,tel:"031-8045-2883"},
 {id:3,name:"중앙시장 고객쉼터 개방화장실",shortName:"중앙시장 쉼터 화장실",lat:37.3970,lng:126.9530,distance:430,openHours:"09:00~20:00(예시)",isOpen:true,stairs:true,ramp:false,handrail:false,emergencyBell:false,tel:"031-8045-2885"}
];
let voiceEnabled=true,largeFontMode=false,currentNavTarget=null,remainingDistance=0,userLocation={lat:37.3938,lng:126.9560};

document.addEventListener("DOMContentLoaded",()=>{
  initGeolocation(); renderQuickList();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
  setupDeviceOrientation();
});

function initGeolocation(){
 const loc=document.getElementById("current-location-text"),status=document.getElementById("gps-status-indicator");
 if(!("geolocation" in navigator)){loc.textContent="📍 이 기기에서는 위치 기능을 사용할 수 없습니다";return;}
 navigator.geolocation.getCurrentPosition(p=>{
   userLocation={lat:p.coords.latitude,lng:p.coords.longitude};
   loc.textContent="📍 현재 위치: GPS 수신 중";
   status.textContent="● GPS 연결"; status.className="text-xs text-safeGreen font-bold";
   recalcDistances();renderQuickList();
 },()=>{
   loc.textContent="📍 위치 권한이 없어 예시 위치를 사용합니다";
   status.textContent="○ 예시 위치";
 },{enableHighAccuracy:true,timeout:8000});
}
function calculateDistance(a,b,c,d){const R=6371e3,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function recalcDistances(){restroomList.forEach(r=>r.distance=Math.round(calculateDistance(userLocation.lat,userLocation.lng,r.lat,r.lng)));restroomList.sort((a,b)=>a.distance-b.distance)}
function renderQuickList(){
 const el=document.getElementById("quick-toilet-list"); el.innerHTML="";
 restroomList.forEach(r=>{
   const min=Math.max(1,Math.ceil(r.distance/50)),card=document.createElement("button");
   card.className="w-full text-left bg-cardDark border-2 border-borderDark rounded-2xl p-4 flex justify-between items-center active:scale-[.99]";
   card.onclick=()=>startSpecificNavigation(r.id);
   card.innerHTML=`<div class="pr-2"><div class="flex gap-1.5 mb-1"><span class="text-xs px-2 py-0.5 rounded font-black ${r.stairs?'bg-gray-700 text-gray-300':'bg-green-950 text-safeGreen border border-safeGreen'}">${r.stairs?'계단 있음':'🚫 계단 없음'}</span></div><h3 class="text-lg font-black">${r.shortName}</h3><p class="text-xs text-gray-400 mt-1">${r.openHours}</p></div><div class="text-right"><div class="text-2xl font-black text-safeYellow">${r.distance}m</div><div class="text-xs text-gray-300">약 ${min}분</div><span class="inline-block mt-1 bg-yellow-400 text-black text-xs font-black px-2 py-1 rounded-lg">안내 ›</span></div>`;
   el.appendChild(card);
 });
}
function startEmergencySearch(){startNavigationWith(restroomList.find(r=>!r.stairs&&r.isOpen)||restroomList[0])}
function startSpecificNavigation(id){const r=restroomList.find(x=>x.id===id);if(r)startNavigationWith(r)}
function startNavigationWith(r){
 currentNavTarget=r;remainingDistance=r.distance;
 document.getElementById("view-home").classList.add("hidden");document.getElementById("view-navigation").classList.remove("hidden");
 document.getElementById("nav-target-name").textContent=r.name;document.getElementById("nav-hours").textContent=r.openHours;document.getElementById("nav-call-link").href="tel:"+r.tel;
 document.getElementById("nav-target-tags").innerHTML=`<span class="bg-yellow-950 border border-safeYellow text-safeYellow text-xs font-bold px-2 py-0.5 rounded">${r.stairs?'계단 주의':'🚫 계단 없음'}</span><span class="bg-gray-800 text-gray-200 text-xs font-bold px-2 py-0.5 rounded">${r.ramp?'경사로 있음':'경사로 미확인'}</span>`;
 updateNavDisplay();speak(`안내를 시작합니다. 전방 ${r.distance}미터, ${r.shortName}입니다. 현재는 프로토타입 안내입니다.`);
}
function updateNavDisplay(){
 const m=Math.max(1,Math.ceil(remainingDistance/50));
 document.getElementById("nav-distance-text").innerHTML=remainingDistance+'<span class="text-2xl text-white ml-1">m</span>';
 document.getElementById("nav-time-text").innerHTML='어르신 걸음으로 <span class="text-safeGreen font-black">약 '+m+'분</span>';
 const arrow=document.getElementById("compass-arrow"),msg=document.getElementById("nav-guidance-instruction");
 if(remainingDistance>80){arrow.style.transform="rotate(0deg)";msg.textContent="🚶 계단 없는 길을 우선하는 예시 안내입니다"}
 else if(remainingDistance>30){arrow.style.transform="rotate(25deg)";msg.textContent="↗️ 약 50m 앞 오른쪽 방향 예시"}
 else{arrow.style.transform="rotate(0deg)";msg.textContent="🚾 곧 목적지입니다"}
}
function simulateWalkStep(){if(remainingDistance<=0)return;remainingDistance=Math.max(0,remainingDistance-35);updateNavDisplay();if(remainingDistance===0)speak("목적지에 도착했습니다. 실제 이용 전 현장 표지와 개방 여부를 확인해주세요.")}
function stopNavigation(){speechSynthesis?.cancel();document.getElementById("view-navigation").classList.add("hidden");document.getElementById("view-home").classList.remove("hidden");currentNavTarget=null}
function speak(t){if(!voiceEnabled||!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.88;window.speechSynthesis.speak(u)}
function toggleVoice(){voiceEnabled=!voiceEnabled;document.getElementById("tts-icon").textContent=voiceEnabled?"🔊":"🔇";if(voiceEnabled)speak("음성 안내가 켜졌습니다.");else speechSynthesis?.cancel()}
function toggleFontSize(){largeFontMode=!largeFontMode;document.body.classList.toggle("text-scale-large",largeFontMode);document.getElementById("btn-font-toggle").textContent=largeFontMode?"가-":"가+"}
function setupDeviceOrientation(){if(window.DeviceOrientationEvent)window.addEventListener("deviceorientation",e=>{if(e.alpha!==null&&currentNavTarget&&remainingDistance>40){document.getElementById("compass-arrow").style.transform=`rotate(${Math.round(e.alpha%360)}deg)`}})}
</script>
</body>
</html>
