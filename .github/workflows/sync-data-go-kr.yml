name: Sync Data.go.kr Public Toilets

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_data_go_kr.py"
      - "scripts/compute_open_status.py"
      - ".github/workflows/sync-data-go-kr.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch official public-restroom API and inspect schema
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATA_GO_KR_ENDPOINT: ${{ vars.DATA_GO_KR_ENDPOINT }}
        run: python3 scripts/sync_data_go_kr.py

      - name: Compute current opening status
        run: python3 scripts/compute_open_status.py

      - name: Commit normalized API cache and schema report
        run: |
          if git diff --quiet -- data/toilets-live.json data/schema-report.json; then
            echo "No API data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/toilets-live.json data/schema-report.json
          git commit -m "data: refresh data.go.kr public restroom cache"
          git pull --rebase origin main
          git push
