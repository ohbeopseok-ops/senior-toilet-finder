name: Geocode Public Toilet Addresses

on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/geocode_toilets.py"
      - ".github/workflows/geocode-toilets.yml"

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coordinate converter
        run: pip install pyproj

      - name: Prepare Anyang live dataset
        run: python3 scripts/prepare_anyang_live.py

      - name: Geocode all Anyang restroom addresses
        env:
          JUSO_SEARCH_KEY: ${{ secrets.JUSO_SEARCH_KEY }}
          JUSO_COORD_KEY: ${{ secrets.JUSO_COORD_KEY }}
          GEOCODE_REGIONS: "안양시"
          GEOCODE_MAX: "249"
        run: python3 scripts/geocode_toilets.py

      - name: Compute current opening status
        run: python3 scripts/compute_open_status.py

      - name: Build district success and failure report
        run: python3 scripts/report_anyang_geocode.py

      - name: Promote live Anyang data and retire prototype fallback when ready
        run: python3 scripts/promote_anyang_live.py

      - name: Commit enriched coordinates and reports
        run: |
          git add data/toilets-live.json data/toilets-fallback.json data/anyang-geocode-report.json docs/ANYANG_GEOCODE_REPORT.md
          if git diff --cached --quiet; then
            echo "No coordinate/report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: geocode Anyang toilets and refresh report"
          git pull --rebase origin main
          git push
