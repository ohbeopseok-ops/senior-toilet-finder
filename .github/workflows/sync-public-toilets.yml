name: Sync Public Toilet Data

on:
  schedule:
    - cron: "20 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_public_toilets.py"
      - ".github/workflows/sync-public-toilets.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync official public restroom data
        env:
          PUBLIC_TOILET_SOURCE_URL: ${{ vars.PUBLIC_TOILET_SOURCE_URL }}
        run: |
          if [ -z "$PUBLIC_TOILET_SOURCE_URL" ]; then
            unset PUBLIC_TOILET_SOURCE_URL
          fi
          python3 scripts/sync_public_toilets.py

      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/toilets-live.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/toilets-live.json
          git commit -m "data: refresh official public toilet cache"
          git push
